server:
  port: 8083   # 8080 = core-api, 8081 = cornalix-ms-identity, 8082 = cornalix-ms-diagnostic

spring:
  application:
    name: cornalix-ms-scoring

  # Base de donnees H2 en memoire (SCRUM-47) : premiere donnee stockee
  # par ce service (historique des scores, pour la tendance dans le
  # temps) -- tout le reste reste calcule a la volee. DB_CLOSE_DELAY=-1
  # evite la perte de donnees constatee ailleurs (SCRUM-31) quand Hikari
  # evince la connexion (veille du laptop).
  datasource:
    url: jdbc:h2:mem:scoringdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true

# Coordonnees du User Pool Cognito qui emet les jetons acceptes par cette
# API -- le meme pool que cornalix-ms-identity et cornalix-ms-diagnostic
# (SCRUM-1/SCRUM-2), deja deploye en dev. Surchargeable via variables
# d'environnement pour un autre environnement (staging/prod).
cornalix:
  cognito:
    region: ${COGNITO_REGION:ca-central-1}
    user-pool-id: ${COGNITO_USER_POOL_ID:ca-central-1_9cLNOsUJ3}
  # cornalix-ms-diagnostic est la seule source de verite pour le catalogue
  # de questions et les reponses (SCRUM-14) -- ce service ne recalcule le
  # score lui-meme qu'a partir de la, mais garde desormais un historique
  # (SCRUM-47) de ses propres resultats.
  diagnostic:
    base-url: ${DIAGNOSTIC_BASE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

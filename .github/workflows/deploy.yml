# CI/CD : push sur develop -> environnement dev, push sur master ->
# environnement prod (meme cluster ECS partage -- seuls le tag
# d'image, le service ECS cible et l'environnement GitHub Actions
# changent).
#
# Authentification AWS par federation OIDC (role-to-assume) -- aucune
# cle d'acces long-terme stockee en secret GitHub. Deux roles distincts
# (cornalix-prod-github-actions-scoring / cornalix-dev-github-actions-scoring,
# infra/prod/platform/github-oidc.tf + dev-environment.tf, cornalix-ms-identity),
# chacun scope a son seul depot ECR + son seul service ECS.
name: Deploy

on:
  push:
    branches: [develop, master]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: cornalix-scoring
  ECS_CLUSTER: cornalix-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.ref_name == 'master' && 'latest' || 'dev' }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy to ECS
        env:
          ECS_SERVICE: cornalix-${{ github.ref_name == 'master' && 'prod' || 'dev' }}-scoring
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment
